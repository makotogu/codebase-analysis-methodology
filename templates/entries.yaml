# =====================================================================
# entries.yaml — 入口普查清单（T2，04-工具箱设计 / 05-Java-Spring落地指南）
# ---------------------------------------------------------------------
# 性质：机器段为主（可重跑覆盖），human_note 为人工段（重跑保留）。
# id 规则：全局唯一、稳定，与 entry_weights.csv（T4 收口点产出）的
#          entry_id 一致，两边才能 join。
# type 取值：http | cron | mq | event | webhook | rpc-in | rpc-out
# artifact_metadata 引用统一 provenance；stable ID 变更写 aliases/previous_id/lineage。
# runtime_status 来自限定环境和窗口内的对账（actuator / 注册中心 / 收口点日志）：
#   active         观测到真实流量
#   dead-candidate 静态有、运行时没有（条件未激活或死代码）
#   gap            运行时有、静态没有（普查漏洞：动态注册等）
#   unknown        尚未对账
# =====================================================================

