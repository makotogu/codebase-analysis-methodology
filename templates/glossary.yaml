# =====================================================================
# glossary.yaml — 术语对照表（02-证据体系 第二节）
# ---------------------------------------------------------------------
# 性质：人工段。机器重跑任何分析都不得覆盖本文件。
# 用法：每次 Agent 会话开始时整体注入为上下文；访谈产出的每个
#       澄清都回填到这里，而不是散落在聊天记录里。
# 纪律：business_meaning 必须来自具名的人，confirmed_date 必填——
#       业务理解会过时，来源和时间让它可审计、可更新。
# =====================================================================

